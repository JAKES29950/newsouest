<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsOuest - Bandeau TV d'Information Sportive</title>
    <!-- Favicon intégré en Data URL pour éviter toute erreur 404 dans la console -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23dc2626%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>">
    <style>
        :root {
            --primary-red: #dc2626;
            --dark-bg: #090d16;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, #1e293b, #0f172a);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .live-badge {
            background-color: var(--primary-red);
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
        }

        h1 span {
            color: var(--primary-red);
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--primary-red);
            border-color: var(--primary-red);
        }

        .btn-primary:hover {
            background-color: #b91c1c;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .preview-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-card-header {
            background-color: #0f172a;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sport-tag {
            background-color: var(--primary-red);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 0.25rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .preview-body {
            padding: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .preview-icon-box {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #0f172a, #334155);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fca5a5;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .preview-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .preview-content p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        .preview-footer {
            padding: 0.75rem 1.5rem;
            background-color: rgba(15, 23, 42, 0.5);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* TV NEWS TICKER BANNER */
        .tv-ticker-container {
            background: linear-gradient(to bottom, #1e293b, #090d16);
            border-top: 3px solid var(--primary-red);
            border-bottom: 3px solid var(--border-color);
            width: 100%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.4);
        }

        .tv-ticker-label {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background-color: var(--primary-red);
            color: white;
            font-weight: 900;
            font-size: 0.9rem;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .tv-ticker-track-wrapper {
            overflow: hidden;
            white-space: nowrap;
            padding: 0.85rem 0;
            margin-left: 140px;
            cursor: pointer;
        }

        .tv-ticker-track {
            display: inline-flex;
            gap: 3rem;
            will-change: transform;
        }

        .tv-ticker-track.paused {
            animation-play-state: paused !important;
        }

        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 1rem;
        }

        .ticker-icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fca5a5;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .ticker-category {
            background-color: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .ticker-title {
            font-weight: 700;
            color: #ffffff;
        }

        .ticker-separator {
            color: var(--primary-red);
            font-weight: bold;
            margin-left: 1.5rem;
        }

        /* MODAL PANEL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            width: 92%;
            max-width: 950px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .admin-table th, .admin-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .admin-table th {
            background-color: #0f172a;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .admin-input {
            width: 100%;
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .admin-thumb {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: #fca5a5;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
