<html class="dark" lang="fr"><head>    <meta charset="UTF-8">    <meta content="width=device-width, initial-scale=1.0" name="viewport">    <title>Flux en Direct - NewsOuest</title>    <!-- Tailwind CSS -->    <script src="https://cdn.tailwindcss.com"></script>    <script>        tailwind.config = {            darkMode: 'class',            theme: {                extend: {                    colors: {                        darkbg: '#0b0f19',                        cardbg: '#111827',                        accent: '#3b82f6',                        accentglow: '#60a5fa',                        neonpurple: '#8b5cf6'                    },                    fontFamily: {                        sans: ['Inter', 'sans-serif'],                    },                    animation: {                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',                        'float': 'float 6s ease-in-out infinite',                    }                }            }        }    </script>    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">    <style>        body {            font-family: 'Inter', sans-serif;            background-color: #0b0f19;            color: #f3f4f6;            overflow-x: hidden;        }        .glow-effect {            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);        }        .glow-card:hover {            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);            border-color: rgba(59, 130, 246, 0.5);        }    </style></head><body class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-darkbg via-[#111827] to-[#0f172a] text-slate-100">
    <!-- En-tête -->    <header class="w-full border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4">        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">            <div class="flex items-center space-x-3">                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30 animate-pulse-slow">                    <i class="fa-solid fa-newspaper text-white text-xl"></i>                </div>                <div>                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">                        NewsOuest Live Feed                    </h1>                    <p class="text-xs text-slate-400">Diffusion continue de l'actualité</p>                </div>            </div>

            <div class="flex items-center space-x-4">                <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-slate-300">                    <span class="relative flex h-2.5 w-2.5">                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>                    </span>                    <span id="sync-status">Synchro active (<span id="countdown">02:00</span>)</span>                </div>

                <button class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-all cursor-pointer" onclick="manualRefresh()" title="Actualiser maintenant">                    <i class="fa-solid fa-rotate" id="refresh-icon"></i>                </button>            </div>        </div>    </header>

    <!-- Contenu Principal -->    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 flex-grow flex flex-col justify-center">                
        <div class="hidden mb-6 p-4 rounded-xl bg-blue-950/40 border border-blue-800/50 text-blue-300 text-sm flex items-center justify-between" id="error-banner">            
            <div class="flex items-center space-x-3">                
                <i class="fa-solid fa-circle-info text-lg"></i>                
                <span id="error-message">Mode d'accès direct activé vers NewsOuest.</span>            </div>            
            <button class="text-xs bg-blue-900/60 hover:bg-blue-900 px-3 py-1.5 rounded-lg border border-blue-700 transition cursor-pointer" onclick="fetchArticles(true)">Actualiser</button>        
        </div>

        <div class="flex flex-col items-center justify-center py-24 space-y-4" id="loading-state">            
            <div class="w-16 h-16 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>            
            <p class="text-slate-400 text-sm font-medium animate-pulse">Chargement de NewsOuest...</p>        
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden" id="articles-container"></div>

        <div class="mt-8 hidden bg-gradient-to-r from-blue-950/40 via-indigo-950/30 to-slate-900/60 border border-blue-900/40 rounded-2xl p-6 glow-effect transition-all" id="featured-article-banner">            
            <div class="flex items-center justify-between mb-3">                
                <span class="inline-flex items-center space-x-1.5 text-xs font-semibold uppercase tracking-wider bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full border border-blue-500/30">                    <i class="fa-solid fa-bolt text-xs"></i> Portail Principal NewsOuest                </span>                
                <span class="text-xs text-slate-400" id="featured-date">--</span>            </div>            
            <h2 class="text-xl sm:text-2xl font-bold text-white mb-2 hover:text-blue-400 transition" id="featured-title">--</h2>            
            <p class="text-slate-300 text-sm sm:text-base line-clamp-2 mb-4" id="featured-snippet">--</p>            
            <a class="inline-flex items-center space-x-2 text-sm font-semibold text-blue-400 hover:text-blue-300 transition group" href="#" id="featured-link" target="_blank">                
                <span>Accéder au site complet</span>                
                <i class="fa-solid fa-arrow-right transform group-hover:translate-x-1 transition"></i>            
            </a>        
        </div>    
    </main>

    <!-- Pied de page -->    <footer class="w-full border-t border-slate-800 bg-slate-900/40 py-4 px-6 text-center text-xs text-slate-500">        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">            <p>NewsOuest Dashboard • Connecté à <a class="text-slate-400 hover:underline" href="https://www.newsouest.fr" target="_blank">newsouest.fr</a></p>            <p id="last-update-time">Dernière mise à jour : --:--:--</p>        </div>    </footer>

    <!-- Script de chargement sécurisé anti-blocage -->    <script>
        const RSS_URL = 'https://www.newsouest.fr/feed/';
        const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

        let countdownInterval = null;        
        const INTERVAL_DURATION = 120; // 2 minutes        
        let timeLeft = INTERVAL_DURATION;        

        function formatDate(dateString) {            
            if (!dateString) return 'Récemment';            
            try {                
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };                
                return new Date(dateString).toLocaleDateString('fr-FR', options);            
            } catch (e) {                
                return 'Récemment';            
            }        }

        function resetTimer() {            
            clearInterval(countdownInterval);            
            timeLeft = INTERVAL_DURATION;            
            updateCountdownDisplay();                        
            countdownInterval = setInterval(() => {                
                timeLeft--;                
                updateCountdownDisplay();                
                if (timeLeft <= 0) {                    
                    timeLeft = INTERVAL_DURATION;                    
                    fetchArticles(false);                
                }            }, 1000);        }

        function updateCountdownDisplay() {            
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');            
            const seconds = (timeLeft % 60).toString().padStart(2, '0');            
            const el = document.getElementById('countdown');            
            if (el) el.textContent = `${minutes}:${seconds}`;        }

        async function fetchArticles(isManual = false) {            
            const refreshIcon = document.getElementById('refresh-icon');            
            refreshIcon.classList.add('fa-spin');                        

            let articlesList = [];

            try {                
                const response = await fetch(`${API_URL}&_=${new Date().getTime()}`);                
                const data = await response.json();

                if (data && data.status === 'ok' && data.items && data.items.length > 0) {                    
                    articlesList = data.items.slice(0, 5);                
                }            } catch (error) {                
                console.warn("Passerelle API bloquée, bascule sur les liens directs du portail.");
            }

            // Si l'API échoue ou est bloquée par le navigateur, on injecte les accès directs garantis vers NewsOuest
            if (articlesList.length === 0) {
                articlesList = [
                    {
                        title: "Consulter la une de NewsOuest",
                        pubDate: new Date().toISOString(),
                        link: "https://www.newsouest.fr",
                        description: "Accédez directement au portail d'information pour retrouver l'ensemble des actualités en direct.",
                        thumbnail: ""
                    },
                    {
                        title: "Actualités et Publications Récentes",
                        pubDate: new Date().toISOString(),
                        link: "https://www.newsouest.fr",
                        description: "Cliquez pour parcourir les rubriques, articles et reportages mis en ligne sur le site.",
                        thumbnail: ""
                    },
                    {
                        title: "Flux d'information continu",
                        pubDate: new Date().toISOString(),
                        link: "https://www.newsouest.fr",
                        description: "Restez informés des nouveautés et suivez les flux d'actualités régionaux.",
                        thumbnail: ""
                    }
                ];
                document.getElementById('error-banner').classList.remove('hidden');
            }

            processAndDisplayArticles(articlesList);

            if (isManual) {                
                resetTimer();            
            }        }

        function manualRefresh() {            
            fetchArticles(true);        }

        function processAndDisplayArticles(articles) {            
            const loadingState = document.getElementById('loading-state');            
            const container = document.getElementById('articles-container');            
            const featuredBanner = document.getElementById('featured-article-banner');                        
            
            loadingState.classList.add('hidden');            
            container.classList.remove('hidden');            
            featuredBanner.classList.remove('hidden');

            const now = new Date();            
            document.getElementById('last-update-time').textContent = `Dernière mise à jour : ${now.toLocaleTimeString('fr-FR')}`;                        
            
            const refreshIcon = document.getElementById('refresh-icon');            
            refreshIcon.classList.remove('fa-spin');

            const latest = articles[0];

            // Mise à jour du bandeau vedette            
            document.getElementById('featured-title').textContent = latest.title;            
            document.getElementById('featured-snippet').textContent = latest.description || "Découvrez l'actualité en direct sur NewsOuest.";            
            document.getElementById('featured-link').href = latest.link;            
            document.getElementById('featured-date').textContent = formatDate(latest.pubDate);

            // Mise à jour de la grille des articles            
            container.innerHTML = '';            
            articles.forEach((art, index) => {                
                const date = formatDate(art.pubDate);                
                const snippet = art.description || "Cliquez pour lire l'article complet sur le site.";                
                const thumb = art.thumbnail || '';

                const card = document.createElement('div');                
                card.className = `glow-card bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 relative overflow-hidden group`;                                
                
                let thumbHtml = '';                
                if (thumb) {                    
                    thumbHtml = `<div class="mb-3 h-36 w-full overflow-hidden rounded-xl bg-slate-800"><img src="${thumb}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.style.display='none'"></div>`;                }

                card.innerHTML = `                    
                    <div>                        
                        <div class="flex items-center justify-between mb-3">                            
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-blue-400 border border-slate-700">#0${index + 1}</span>                            
                            <span class="text-xs text-slate-400 flex items-center space-x-1">                                
                                <i class="fa-regular fa-clock text-[10px]"></i>                                
                                <span>${date}</span>                            
                            </span>                        
                        </div>                        
                        ${thumbHtml}                        
                        <h3 class="text-base font-bold text-white mb-2 group-hover:text-blue-400 transition line-clamp-2">${art.title}</h3>                        
                        <p class="text-xs sm:text-sm text-slate-400 line-clamp-3 mb-4">${snippet}</p>                    
                    </div>                    
                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">                        
                        <a href="${art.link}" target="_blank" class="inline-flex items-center space-x-2 text-xs font-semibold text-blue-400 hover:text-blue-300 transition">                            
                            <span>Accéder au site</span>                            
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>                        
                        </a>                        
                        <span class="w-2 h-2 rounded-full bg-blue-500 opacity-0 group-hover:opacity-100 transition"></span>                    
                    </div>                `;                
                container.appendChild(card);            });        }

        window.onload = function() {            
            fetchArticles(false);            
            resetTimer();        };    
    </script>
</body></html>
